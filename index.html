// ── Image upload ImgBB ────────────────────────────────────────────────────────
async function uploadPhoto(file) {
  const compressed = await new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const SIZE = 300;
      const canvas = document.createElement("canvas");
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext("2d");
      const ratio = Math.max(SIZE / img.width, SIZE / img.height);
      const w = img.width * ratio, h = img.height * ratio;
      ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      res(canvas.toDataURL("image/jpeg", 0.65));
    };
    img.onerror = rej;
    img.src = url;
  });
  const fd = new FormData();
  fd.append("image", compressed.split(",")[1]);
  const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
  if (!r.ok) throw new Error("ImgBB " + r.status);
  const j = await r.json();
  if (!j.success) throw new Error("ImgBB error");
  return j.data.url;
}

// ── Score ─────────────────────────────────────────────────────────────────────
function calcScore(answers, photos) {
  let pts = 0, maxPts = 0, correct = 0;
  for (const ph of photos) {
    const w = ph.bonus ? 3 : 1;
    maxPts += w;
    if (answers[ph.id] === ph.correctName) { pts += w; correct++; }
  }
  return { pts, maxPts, correct, total: photos.length, pct: maxPts ? Math.round(pts / maxPts * 100) : 0 };
}

function Confetti({active}) {
  const ref=useRef(null);
  useEffect(()=>{
    if(!active)return;
    const canvas=ref.current;if(!canvas)return;
    const ctx=canvas.getContext("2d");
    const resize=()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;};
    resize();window.addEventListener("resize",resize);
    const cols=["#FF8FAB","#FFB3C6","#FF4D6D","#FFCCD5","#FF006E","#FFC8DD"];
    const parts=Array.from({length:160},()=>({x:Math.random()*window.innerWidth,y:Math.random()*-window.innerHeight,w:Math.random()*12+5,h:Math.random()*7+3,color:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*360,rotS:(Math.random()-.5)*7,vy:Math.random()*3+1.5,vx:(Math.random()-.5)*2}));
    let frame;
    const draw=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);parts.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();p.y+=p.vy;p.x+=p.vx;p.rot+=p.rotS;if(p.y>window.innerHeight){p.y=-20;p.x=Math.random()*window.innerWidth;}});frame=requestAnimationFrame(draw);};
    draw();
    return()=>{cancelAnimationFrame(frame);window.removeEventListener("resize",resize);};
  },[active]);
  if(!active)return null;
  return React.createElement('canvas',{ref,style:{position:"fixed",top:0,left:0,pointerEvents:"none",zIndex:9999}});
}

        React.createElement('div',{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:"9px"}},
          photos.map(ph=>{const given=answers[ph.id];const ok=given===ph.correctName;
            return React.createElement('div',{key:ph.id,style:{background:ok?"#E8F8EF":"#FFF0F0",border:`2px solid ${ok?"#6BCB77":C.pink1}`,borderRadius:"12px",padding:"7px",textAlign:"center"}},
              React.createElement('div',{style:{background:"white",padding:"4px 4px 18px",borderRadius:"3px"}},React.createElement('img',{src:ph.src,alt:"",style:{width:"100%",aspectRatio:"1",objectFit:"cover",borderRadius:"2px"}})),
              React.createElement('div',{style:{fontSize:"0.68rem",fontFamily:sans,fontWeight:800,color:ok?"#27AE60":C.pink1,marginTop:"5px",lineHeight:1.3}},ok?"✓":"✗"," ",ph.correctName),
              ph.bonus&&ok&&React.createElement('div',{style:{fontSize:"0.58rem",color:C.gold,fontFamily:sans,fontWeight:800,marginTop:"2px"}},"+3 pts ⭐"),
              ph.bonus&&!ok&&React.createElement('div',{style:{fontSize:"0.58rem",color:C.gold,fontFamily:sans,marginTop:"2px",opacity:.7}},"valait ⭐ 3 pts"),
              ph.excluded&&React.createElement('div',{style:{fontSize:"0.58rem",color:"#888",fontFamily:sans,marginTop:"2px"}},"🚫 sans joueur"),
              !ok&&given&&React.createElement('div',{style:{fontSize:"0.6rem",color:C.sub,fontFamily:sans,marginTop:"1px"}},`Ta réponse : ${given}`)
            );
          })
        )
      )
    )
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App() {
  const [screen,setScreen]=useState("welcome");
  const [playerName,setPN]=useState("");
  const [photos,setPhotos]=useState([]);
  const [results,setResults]=useState([]);
  const [winner,setWinner]=useState(null);
  const [revealed,setRevealed]=useState(false);
  const [playerData,setPD]=useState(null);
  const [loading,setLoading]=useState(true);
  const [loadError,setLoadError]=useState(false);
  const [locked,setLocked]=useState(null);

  useEffect(()=>{
    (async()=>{
      try{
        const data=await dbGetAll();
        if(data.photos) setPhotos(data.photos);
        if(data.results) setResults(data.results);
        if(data.winner) setWinner(data.winner);
        if(data.revealed) setRevealed(data.revealed);
        const lk=lsGet(LOCAL_KEY);if(lk)setLocked(lk);
        setLoading(false);
      }catch(e){
        console.error(e);
        setLoadError(true);
        setLoading(false);
      }
    })();
  },[]);

  async function saveConfig(p){
    setPhotos(p);
    await dbSet("photos",p);
  }

  async function setWin(n){
    setWinner(n);
    await dbSet("winner",n);
  }

  async function doReveal(){
    setRevealed(true);
    await dbSet("revealed",true);
  }

  async function play(name){
    setPN(name);lsSet(LOCAL_KEY,name);setLocked(name);
    const prog=await dbGet(`prog_${name.toLowerCase().replace(/\s+/g,"_")}`);
    const pd=prog||{answers:{},submitted:false};
    setPD(pd);
    setScreen(pd.submitted?(revealed?"results-revealed":"submitted"):"quiz");
  }

  async function saveProgress(answers){
    const key=`prog_${playerName.toLowerCase().replace(/\s+/g,"_")}`;
    const prog={answers,submitted:false};
    setPD(prog);
    await dbSet(key,prog);
    // Update results list
    const newResults=[...results.filter(r=>r.playerName!==playerName),{playerName,answers,submitted:false,date:null}];
    setResults(newResults);
    await dbSet("results",newResults);
  }

  async function submitAnswers(answers){
    const date=new Date().toLocaleString("fr-FR");
    const key=`prog_${playerName.toLowerCase().replace(/\s+/g,"_")}`;
    const prog={answers,submitted:true};
    setPD(prog);
    await dbSet(key,prog);
    const newResults=[...results.filter(r=>r.playerName!==playerName),{playerName,answers,submitted:true,date}];
    setResults(newResults);
    await dbSet("results",newResults);
    setScreen(revealed?"results-revealed":"submitted");
  }

  if(loading) return React.createElement(Spinner,{text:"Connexion… 🌸"});

  if(loadError) return React.createElement(Center,null,
    React.createElement(Card,{maxWidth:"400px",style:{textAlign:"center"}},
      React.createElement('div',{style:{fontSize:"3rem",marginBottom:"12px"}},"❌"),
      React.createElement(Script,{size:"1.5rem",style:{marginBottom:"8px"}},"Erreur de connexion"),
      React.createElement('div',{style:{fontFamily:sans,color:C.sub,fontSize:"0.9rem",marginBottom:"16px"}},"Impossible de charger les données. Vérifie ta connexion internet."),
      React.createElement(Btn,{onClick:()=>window.location.reload()},"🔄 Réessayer")
    )
  );

  const bgStars=Array.from({length:16},(_,i)=>({top:`${(i*19+5)%100}%`,left:`${(i*31+8)%100}%`,size:(i%3)*5+10,op:0.05+(i%4)*0.04}));

  return React.createElement('div',{style:{minHeight:"100vh",background:C.bg,fontFamily:"'Georgia',serif",color:C.text,position:"relative"}},
    React.createElement('div',{style:{position:"fixed",inset:0,pointerEvents:"none",zIndex:0}},
      bgStars.map((s,i)=>React.createElement('svg',{key:i,width:s.size,height:s.size,viewBox:"0 0 24 24",style:{position:"absolute",top:s.top,left:s.left,opacity:s.op,fill:C.pink1}},
        React.createElement('polygon',{points:"12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"})
      ))
    ),
    screen==="welcome"&&React.createElement(Welcome,{photos,locked,onPlay:play,onAdmin:()=>setScreen("admin-login")}),
    screen==="admin-login"&&React.createElement(AdminLogin,{onOk:()=>setScreen("admin"),onBack:()=>setScreen("welcome")}),
    screen==="admin"&&React.createElement(AdminPanel,{photos,results,winner,revealed,onSave:saveConfig,onSetWinner:setWin,onReveal:doReveal,onBack:()=>setScreen("welcome")}),
    screen==="quiz"&&playerData&&React.createElement(Quiz,{playerName,photos,savedAnswers:playerData.answers,onSave:saveProgress,onSubmit:submitAnswers}),
    screen==="submitted"&&playerData&&React.createElement(Submitted,{playerName,photos,answers:playerData.answers}),
    screen==="results-revealed"&&playerData&&React.createElement(ResultsRevealed,{playerName,answers:playerData.answers,photos,winner,allResults:results})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
